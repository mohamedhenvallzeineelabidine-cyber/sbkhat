<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="">
<meta name="theme-color" content="#14563F">
<title>المنظمة الشبابية لإنماء قرية اسبيخات</title>
<!-- Aperçu de partage (WhatsApp, Facebook). Le nom est répété ici volontairement. -->
<meta property="og:title" content="المنظمة الشبابية لإنماء قرية اسبيخات">
<meta property="og:description" content="منصة عضوية وأنشطة المنظمة الشبابية لإنماء قرية اسبيخات">
<meta property="og:image" content="logo-512.png">
<meta property="og:type" content="website">
<link rel="icon" href="logo.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Reem+Kufi:wght@400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="shell" id="app"></main>
  <script src="config.js"></script>
  <script src="app.js"></script>
  <script>
    var isAdmin = location.search.indexOf('admin') > -1;
    var url = isAdmin ? (CONFIG.auth.adminUrl || '') : (CONFIG.auth.loginUrl || '');
    if (url) {
      location.replace(url);
    } else {
      document.getElementById('app').innerHTML =
        '<h1 class="page-title">' + (isAdmin ? 'دخول المشرف' : 'تسجيل الدخول') + '</h1>' +
        T.empty('حسابات الأعضاء غير مفعّلة بعد',
          'هذا الموقع يعمل حالياً بدون قاعدة بيانات. عند إضافة خدمة الحسابات، ضع رابطها في ' +
          '<code>config.js</code> داخل <code>auth.loginUrl</code>.') +
        '<div class="btn-row"><a class="btn btn-primary" href="form.html">استمارة الانضمام</a>' +
        '<a class="btn btn-outline" href="index.html">العودة للرئيسية</a></div>';
    }
    renderChrome('home');
  </script>
</body>
</html>
